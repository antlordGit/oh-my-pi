# ============================================================================
# omp-h5.conf —— 8888 端口业务反代预留
# ----------------------------------------------------------------------------
# 注：H5 移动端已挪到 80 端口的 /h5/ 子路径（见 omp-main.conf），
#     此文件保留为「业务工程反代」专用，监听 8888。
# 编辑后热加载：docker exec omp-app nginx -s reload
# ============================================================================

server {
    listen 8888;
    server_name _;

    # 容器内自测占位
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ===================== 业务工程 location 模板 ↓ 按需启用/修改 =====================

