# ============================================================================
# omp-main.conf —— 本工程主配置
# ----------------------------------------------------------------------------
# 包含：web 前端（SPA 静态资源） + java 后端（REST + WebSocket）
# 改这条文件 = 改本工程本身,需要重建镜像生效。
# 业务工程的反代不要写这里,改 omp-services.conf 即可（热加载,免重建）。
# ============================================================================

server {
    listen 80;
    server_name _;
    root /app/dist;
    index index.html;

    # ---------- 前端 SPA ----------
    # Vue Router history 模式 fallback:所有非 /api、/admin、/ws、/static 的
    # GET 请求都返回 index.html,前端路由由 vue-router 接管。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|woff2?|svg|png|ico|jpg|gif)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ---------- Java 后端 REST ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大请求体（上传场景）
        client_max_body_size 500m;
    }

    # 后台管理路径
    location /admin/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- WebSocket ----------
    # Spring Boot WS endpoint;长读超时拉满,避免长会话被中间设备断连
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # ---------- 业务工程反代 ----------
    # 业务 location 集中在 omp-services.conf,放在 server 块末尾 include。
    # 改业务配置只需 vim 该文件 + nginx -s reload,免重建镜像。
    include /etc/nginx/conf.d/omp-services-locations.conf;
}
