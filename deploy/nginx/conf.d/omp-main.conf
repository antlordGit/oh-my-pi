# ============================================================================
# omp-main.conf —— 本工程主配置（⚠️ 不可编辑）
# ----------------------------------------------------------------------------
# 本文件已打入 Docker 镜像，修改需要重建镜像才能生效。
# 如需新增业务服务代理，请编辑 omp-services-locations.conf（热加载，免重建）。
#
# 代理范围：
#   ① 前端 Vue SPA        — 静态资源 + history 模式 fallback
#   ② Java 后端 REST/WS   — /api/、/admin/、/ws/
#   ③ OMP 服务            — /omp/
#   ④ code-server         — /ide/
# ----------------------------------------------------------------------------
# 监听端口：80（容器内）
# 外部访问：http://<server>:8000/...（宿主机 8000 → 容器 80）
# ============================================================================

server {
    listen 80;
    server_name _;
    root /app/dist;
    index index.html;

    # ---------- H5 移动端（uniapp 构建产物）----------
    # 部署到 /h5/ 子路径,与 PC 端共用 80 端口但路径隔离。
    # uniapp 的 router.base 和 vite base 都设为 /h5/，asset 链接自带前缀。
    # ⚠️ 必须用 ^~ 前缀修饰符阻止正则 location 截胡 /h5/ 下的静态资源请求。
    location ^~ /h5/ {
        alias /app/h5/;
        index index.html;
        try_files $uri $uri/ /h5/index.html;
    }

    # ---------- 前端 Vue SPA ----------
    # Vue Router history 模式 fallback:所有非 /api、/admin、/ws、/ide、/omp 的
    # GET 请求都返回 index.html,前端路由由 vue-router 接管。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（不拦截 ^~ 修饰的 location）
    location ~* \.(js|css|woff2?|svg|png|ico|jpg|gif)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ---------- Java 后端 REST ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大请求体（上传场景）
        client_max_body_size 500m;
    }

    # 后台管理路径
    location /admin/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- WebSocket ----------
    # Spring Boot WS endpoint;长读超时拉满,避免长会话被中间设备断连
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # ---------- OMP 服务 ----------
    # OMP CLI / agent 相关接口（容器内 omp 进程）
    location /omp/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500m;
    }

    # ---------- code-server ----------
    # Web IDE，容器内 code-server 监听 127.0.0.1:<port>
    # 注意：code-server 的 --base-path 需与 location 前缀匹配
    location /ide/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding gzip;
        proxy_read_timeout 86400;
    }
}
