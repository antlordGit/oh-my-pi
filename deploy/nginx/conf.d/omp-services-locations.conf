# ============================================================================
# omp-services-locations.conf —— 业务工程反代配置（✅ 可编辑，热加载）
# ----------------------------------------------------------------------------
# 本文件独立 server 块，不与 omp-main.conf 共享端口。
# 编辑后热加载：docker exec omp-app nginx -s reload（免重建镜像）。
#
# 监听端口：8888（容器内）
# 外部访问：宿主机需额外映射 8888 端口
#   docker run ... -p 8888:8888 ...
#   浏览器访问 http://<server>:8888/<你的前缀>/...
#
# 三个常见模式:
#   ① 纯 API(Java/Go/Python): 反代 + CORS 头(同源可省)
#   ② 静态 SPA(Vue/React):    反代 + history 模式 fallback
#   ③ WebSocket:               反代 + Upgrade/Connection 头
#
# 通用提示:
#   - `location /前缀/` + `proxy_pass http://上游;` 注意末尾的 /:
#     * 带 / → strip 前缀(浏览器 /foo/bar → 上游 /bar)
#     * 不带 → 保留前缀
#   - 容器内自测: `curl -sI http://127.0.0.1:8888/前缀/`
#   - 容器外自测: `curl -sI http://<server>:8888/前缀/`
# ============================================================================

server {
    listen 8888;
    server_name _;

