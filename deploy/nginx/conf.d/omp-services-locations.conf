# ============================================================================
# omp-services-locations.conf —— 业务工程反代 location 片段
# ----------------------------------------------------------------------------
# **本文件被 omp-main.conf 的 server 块末尾 include(不是独立 server)**,
# 所以这里只能写 location {...} 块,不能写 server {...}。
# 取消下面模板注释 + `docker exec omp-app nginx -s reload` 即热加载。
#
# 三个常见模式:
#   ① 纯 API(Java/Go/Python): 反代 + CORS 头(同源可省)
#   ② 静态 SPA(Vue/React):    反代 + history 模式 fallback
#   ③ WebSocket:               反代 + Upgrade/Connection 头
#
# 通用提示:
#   - `location /前缀/` + `proxy_pass http://上游;` 注意末尾的 /:
#     * 带 / → strip 前缀(浏览器 /foo/bar → 上游 /bar)
#     * 不带 → 保留前缀
#   - 在容器内 `curl -sI http://127.0.0.1:80/前缀/` 自测(容器内 nginx 监听 80)
#   - 容器外 `curl -sI http://<server>:8000/前缀/` 验证反代
# ============================================================================

