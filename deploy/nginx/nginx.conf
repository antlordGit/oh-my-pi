worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
events { worker_connections 1024; }

# 顶层调度：只负责加载各业务块，具体 location 都在 conf.d/ 下分文件管理。
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # 日志格式（含请求耗时，便于调试反代性能）
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time ut=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # 引入本工程主配置（web 前端 + java 后端）
    include /etc/nginx/conf.d/omp-main.conf;
    # 注:业务工程反代 location 片段(omp-services-locations.conf)不是在这里 include,
    # 而是被 omp-main.conf 的 server 块末尾 include(避免与本工程 server 抢端口)。
}
