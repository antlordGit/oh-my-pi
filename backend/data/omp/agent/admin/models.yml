providers:
  deepseek:
    baseUrl: https://api.deepseek.com/v1
    api: openai-completions
    apiKey: ${DEEPSEEK_API_KEY}
    models:
    - id: deepseek-v4-flash
      name: DeepSeek V4 Flash
      contextWindow: 1000000
      reasoning: true
      thinking:
        mode: effort
        efforts:
        - minimal
        - low
        - medium
        - high
        - xhigh
        effortMap:
          minimal: high
          low: high
          medium: high
          high: high
          xhigh: max
      compat:
        supportsReasoningEffort: true
        reasoningContentField: reasoning_content
        requiresReasoningContentForToolCalls: true
        requiresAssistantContentForToolCalls: true
        extraBody:
          thinking:
            type: enabled
    - id: deepseek-v4-pro
      name: DeepSeek V4 Pro
      contextWindow: 1000000
      reasoning: true
      thinking:
        mode: effort
        efforts:
        - minimal
        - low
        - medium
        - high
        - xhigh
        effortMap:
          minimal: high
          low: high
          medium: high
          high: high
          xhigh: max
      compat:
        supportsReasoningEffort: true
        reasoningContentField: reasoning_content
        requiresReasoningContentForToolCalls: true
        requiresAssistantContentForToolCalls: true
        extraBody:
          thinking:
            type: enabled
