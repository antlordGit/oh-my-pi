# =============================================================================
# application-120.yml —— 10.126.2.120 UAT 服务器生产配置（Docker All-in-One）
# -----------------------------------------------------------------------------
# ⚠️ 本文件含 120 服务器的真实敏感信息(数据库密码、JWT secret)。
#   请勿提交到公共仓库。若已误提交,务必从 git 历史中清除并轮换这些凭证。
# 部署位置:120 服务器 /home/omp/docker-build/prod-application.yml
# 加载方式:--spring.config.additional-location=file:/app/prod-application.yml
#         --spring.profiles.active=prod
# 关联部署 runbook:docs/DEPLOY.md §18（10.126.2.120 UAT 服务器）
# =============================================================================

server:
  port: 8080

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # ⚠️ 容器内用宿主 docker0 网关访问 MySQL,不是 127.0.0.1
    # 容器重建后 docker0 网关不变,但保险起见 host 用 172.17.0.1
    url: jdbc:mysql://172.17.0.1:3306/omp?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: a5gkwGI$!@Xea
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc.time_zone: Asia/Shanghai
    open-in-view: false
  flyway:
    enabled: false    # 数据库表由用户手动创建,后端不自动跑 migration
  # 容器内 Redis：通过宿主 docker0 网关访问宿主机 Redis 实例（端口 6379）
  # 若 120 服务器未单独装 Redis，可启动一个 redis 容器并把端口暴露到 172.17.0.1:6379
  data:
    redis:
      host: ${OMP_REDIS_HOST:172.17.0.1}
      port: ${OMP_REDIS_PORT:6379}
      password: ${OMP_REDIS_PASSWORD:9ww3AHVY*$@d276}
      database: ${OMP_REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
          max-wait: 3000ms

app:
  omp:
    # 容器内 omp 入口(后端 spawn 时调)
    binary: /app/omp/scripts/omp-dev.sh
    # 工作区卷 omp-workspaces 挂载到容器内此路径(与 code-server 同卷同路径)
    workspaces-root: /data/omp/workspaces
    agent-root: /data/omp/agent
    stderr-log-dir: /data/omp/logs
    # 全局 APPEND_SYSTEM 模板，与 <agentDir>/APPEND_SYSTEM.user.md 合并生成 APPEND_SYSTEM.md
    append-system-template-path: /etc/omp/APPEND_SYSTEM.md
    # 共享 agent 根目录（运维统一管理 extensions/skills/hooks/tools 的入口）。
    # entrypoint 在 /root/.omp/agent 上建 symlink → 此目录。
    # Java spawn 时为每个用户在 agentRoot/{user} 下建子目录 symlink 指向 ../<subdir>，
    # 让 omp 子进程（PI_CODING_AGENT_DIR=agentRoot/{user}）自动加载共享生态。
    shared-agent-root: /data/omp/agent
    # 启用 skills 加载（推荐 true）。false 时追加 --no-skills。
    enable-skills: true
    # 禁用 rules（CLAUDE.md / AGENTS.md）加载 —— 安全考虑，
    # 用户工作区内 rules 不属于 omp 平台运营规则，避免污染会话。
    enable-rules: false
    # IDE(code-server 5000→9000,容器内是解密代理)
    ide:
      enabled: true
      public-base-url: http://10.126.2.120:5000
      # HMAC-SHA256 签名 key,64 个 hex 字符 (32 字节)。⚠️ 部署副本里需填实际值,
      # 且必须与 code-server 启动时的 --signing-key 完全一致。
      # 本地留空,默认不加签名(生产部署时务必配置)。
      signing-key: ${OMP_IDE_SIGNING_KEY:}
  security:
    # ⚠️ JWT secret 64 字符随机,每台服务器独立,不要跨机器共用
    jwt-secret: SmDdzEH5aCIEk/R6XkU/bcHUJJ+cmuSbQ+fKpNEJpHfe75RDvQqMJC686OyjX15J
    jwt-ttl-hours: 24
    bootstrap-admin:
      username: admin
      password: admin

logging:
  level:
    root: WARN
    com.yourorg.omp: INFO
