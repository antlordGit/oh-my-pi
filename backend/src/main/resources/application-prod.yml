# Production / dev profile uses MySQL (explicit, no auto-H2 fallback).
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${OMP_DB_URL:jdbc:mysql://127.0.0.1:3306/omp?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: root
    password: a5gkwGI$!@Xea
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc.time_zone: Asia/Shanghai
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true