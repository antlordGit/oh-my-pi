server:
  port: 8080
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 50MB
    max-swallow-size: 50MB

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  application:
    name: omp-backend
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  codec:
    max-in-memory-size: 50MB
  # Redis（系统维护开关用，开发环境默认指向本机 6379）
  data:
    redis:
      host: ${OMP_REDIS_HOST:127.0.0.1}
      port: ${OMP_REDIS_PORT:6379}
      password: ${OMP_REDIS_PASSWORD:9ww3AHVY*$@d276}
      database: ${OMP_REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
          max-wait: 3000ms

# Application config — see OmpProperties
app:
  omp:
    binary: ${OMP_BIN:/Users/chenzhiwei/bin/omp}
    workspaces-root: ${OMP_WORKSPACES_ROOT:/tmp/omp/workspaces}
    agent-root: ${OMP_AGENT_ROOT:/tmp/omp/agent}
    stderr-log-dir: ${OMP_STDERR_LOG_DIR:/tmp/omp/logs}
    # 全局 APPEND_SYSTEM 模板，与 <agentDir>/APPEND_SYSTEM.user.md 合并生成 APPEND_SYSTEM.md
    append-system-template-path: ${OMP_APPEND_SYSTEM_TEMPLATE:/tmp/omp/APPEND_SYSTEM.md}
    pool:
      max-concurrent: 10
      idle-ttl-minutes: 30
    per-user-session-limit: 100
    default-flags:
      tools: read,edit,write,bash,grep,find,ls
      thinking: medium
      approval-mode: yolo
      no-tui: true
    default-model:
      provider: anthropic
      model-id: claude-sonnet-4-5
    security:
      jwt-secret: ${OMP_JWT_SECRET:local-dev-secret-please-change-32chars-or-more-yes}
      jwt-ttl-hours: 24
      bootstrap-admin:
        username: ${OMP_BOOTSTRAP_ADMIN_USERNAME:admin}
        password: ${OMP_BOOTSTRAP_ADMIN_PASSWORD:admin}
    vault:
      api-key: ${OMP_API_KEY:}
    ide:
      enabled: ${OMP_IDE_ENABLED:true}
      public-base-url: ${OMP_IDE_PUBLIC_BASE_URL:http://localhost:3000}
      # HMAC-SHA256 签名 key,64 个 hex 字符 (32 字节)。空 → 不加签名,folder 原样拼接。
      signing-key: ${OMP_IDE_SIGNING_KEY:}

logging:
  level:
    com.yourorg.omp: INFO
    com.yourorg.omp.rpc.OmpRpcClient: INFO     # ★ 改 DEBUG 可以看 text_delta 增量字符
    org.springframework.web.socket: INFO